<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <title>Skyrim Quests</title>
    <meta name="description" content="A Skyrim-styled quest log for real life: quests, a nightly chronicle, skills, perks and shouts." />
    <meta name="theme-color" content="#000000" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Skyrim Quests" />
    <link rel="icon" type="image/svg+xml" href="./icon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Crimson+Text:ital,wght@0,400;0,700;1,400&family=Jost:wght@400;500;600&display=swap" rel="stylesheet" />
    <script>
      // Restore a deep link that public/404.html bounced through the query string (GitHub Pages SPA routing).
      (function (l) {
        var m = /[?&]p=([^&]*)/.exec(l.search);
        if (!m) return;
        var path = decodeURIComponent(m[1]).replace(/~and~/g, '&');
        if (path.charAt(0) !== '/') return;
        window.history.replaceState(null, null, l.pathname.replace(/\/$/, '') + path + l.hash);
      }(window.location));
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
